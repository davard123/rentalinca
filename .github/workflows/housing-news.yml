name: Housing news source updates
on:
  schedule:
    - cron: '35 15 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: housing-news-main
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test source parsers and safety rules
        run: node --test tests/news.test.mjs
      - name: Check approved sources and render static pages
        run: npm run news:update
      - name: Validate generated feed and pages
        run: npm run news:check && npm run check
      - name: Publish only actual content changes
        shell: bash
        run: |
          git add data/housing-news.json news.html index.html sitemap.xml
          if git diff --cached --quiet; then
            echo 'No content change. No commit or deployment needed.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update official housing news source links'
          # A concurrent human push is a reason to stop, never force-push production.
          git push origin HEAD:main
          echo 'Updated news data and static pages; existing Vercel Git deployment will publish.' >> "$GITHUB_STEP_SUMMARY"
